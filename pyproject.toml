[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathcad-converter"
version = "0.1.0"
description = "Convert PTC Mathcad Prime (.mcdx) worksheets into runnable Jupyter notebooks / Python."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pint>=0.23",
    "nbformat>=5.9",
]

[project.optional-dependencies]
sympy = ["sympy>=1.12"]
numpy = ["numpy>=1.24"]
dev = ["pytest>=7"]

[project.scripts]
mcad2py = "mathcad_converter.cli:main"

[tool.setuptools.packages.find]
include = ["mathcad_converter*"]
