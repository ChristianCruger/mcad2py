[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcad2py"
version = "0.1.0"
description = "Convert PTC Mathcad Prime (.mcdx) worksheets into runnable Jupyter notebooks / Python."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pint>=0.23",
    "nbformat>=5.9",
    "sympy>=1.12",
    "Pillow>=10",
]

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
dev = ["pytest>=7"]

[project.scripts]
mcad2py = "mcad2py.cli:main"

[tool.setuptools.packages.find]
include = ["mcad2py*"]
