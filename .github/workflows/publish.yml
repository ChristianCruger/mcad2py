name: Publish

# Two routes, deliberately kept apart so a rehearsal can never hit real PyPI:
#
#   * push a v* tag           -> builds and publishes to PyPI
#   * run the workflow by hand -> builds and publishes to TestPyPI
#
# Either way the suite has to pass first: every test converts and *executes* a
# real .mcdx fixture from references/, so a green run means the published
# converter still reproduces Mathcad's own cached results.
#
# Uploading uses Trusted Publishing (OIDC) -- no API token is stored anywhere.
# PyPI and TestPyPI are separate services with separate accounts, so each needs
# its own pending publisher registered before its first upload:
#
#   https://pypi.org/manage/account/publishing/
#   https://test.pypi.org/manage/account/publishing/
#
#   project mcad2py | owner ChristianCruger | repo mcad2py
#   workflow publish.yml | environment "pypi" and "testpypi" respectively

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      # A version number can only ever be uploaded once, on TestPyPI as much as
      # on PyPI, so rehearsals get a unique .devN suffix and stay repeatable.
      # (Install one with `pip install --pre`; pip skips dev releases by default.)
      - name: Stamp a dev version for the TestPyPI rehearsal
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import os, pathlib, re
          p = pathlib.Path("pyproject.toml")
          run = os.environ["GITHUB_RUN_NUMBER"]
          text, n = re.subn(
              r'^version = "([^"]+)"',
              lambda m: f'version = "{m.group(1)}.dev{run}"',
              p.read_text(), count=1, flags=re.M,
          )
          assert n == 1, "version line not found in pyproject.toml"
          p.write_text(text)
          print(re.search(r'^version = .*$', text, re.M).group())
          PY

      - name: Test
        run: pytest -q

      - name: Build
        run: python -m build

      - name: Check the distributions
        run: |
          python -m twine check dist/*
          # tests/ and references/ are development-only; they must not ship.
          if tar -tzf dist/*.tar.gz | grep -Eq '/(tests|references)/'; then
            echo "::error::sdist contains tests/ or references/"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Rehearsal: manual runs only.
  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # The real thing: tagged releases only.
  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
